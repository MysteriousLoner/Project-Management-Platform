services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: project_manager
      POSTGRES_USER: project_manager
      POSTGRES_PASSWORD: local-project-password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U project_manager -d project_manager"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: project_manager
      MINIO_ROOT_PASSWORD: local-storage-password
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    image: project-management-platform-app
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-}
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://project_manager:local-project-password@postgres:5432/project_manager
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: project-attachments
      S3_ACCESS_KEY: project_manager
      S3_SECRET_KEY: local-storage-password
      NEXT_TELEMETRY_DISABLED: "1"
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET before starting}
      PMS_INITIAL_PASSWORD: ${PMS_INITIAL_PASSWORD:?Set the private initial account password}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://pms.techmation.my}
      INTERNAL_LLM_MODEL: ${INTERNAL_LLM_MODEL:-gemma-4-no-think}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-3080}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000${NEXT_PUBLIC_BASE_PATH:-}/api/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  migrate:
    image: project-management-platform-app
    command: ["node", "runtime/migrate.mjs"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://project_manager:local-project-password@postgres:5432/project_manager
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: project-attachments
      S3_ACCESS_KEY: project_manager
      S3_SECRET_KEY: local-storage-password
      NEXT_TELEMETRY_DISABLED: "1"
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET before starting}
      PMS_INITIAL_PASSWORD: ${PMS_INITIAL_PASSWORD:?Set the private initial account password}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://pms.techmation.my}
      INTERNAL_LLM_MODEL: ${INTERNAL_LLM_MODEL:-gemma-4-no-think}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  worker:
    image: project-management-platform-app
    command: ["node", "runtime/report-worker.mjs"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://project_manager:local-project-password@postgres:5432/project_manager
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: project-attachments
      S3_ACCESS_KEY: project_manager
      S3_SECRET_KEY: local-storage-password
      NEXT_TELEMETRY_DISABLED: "1"
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET before starting}
      PMS_INITIAL_PASSWORD: ${PMS_INITIAL_PASSWORD:?Set the private initial account password}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://pms.techmation.my}
      INTERNAL_LLM_MODEL: ${INTERNAL_LLM_MODEL:-gemma-4-no-think}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "runtime/worker-health.mjs"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    stop_grace_period: 150s
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
